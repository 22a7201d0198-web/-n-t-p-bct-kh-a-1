<html lang="vi">

<title>Ôn tập từ vựng tiếng Trung</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fdf7fb;--card:#fff;--ink:#3c3450;--mut:#8f88a8;--pri:#a48cf2;--pri2:#ddd5fb;--pink:#fbd3e6;--mint:#cdf3e3;--peach:#ffe2c6;--sky:#cfe8fb;--lem:#fdf3b8;--line:#eadff7;--ok:#4ade80;--bad:#fb7185}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1827;--card:#2a2337;--ink:#f1eaff;--mut:#b0a6c8;--line:#443a5c;--pink:#6b3a58;--mint:#2f5a45;--peach:#6b4a2f;--sky:#2f4f66;--lem:#5e5628;--pri2:#453a6b}}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{background:linear-gradient(120deg,var(--pink),var(--pri2),var(--sky),var(--mint));padding:18px 16px 14px;text-align:center;color:#3c3450}
header h1{margin:0;font-size:1.35rem}header p{margin:4px 0 0;font-size:.82rem}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav,#flt{display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav button,#flt button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 13px;border-radius:999px;font-size:.84rem;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#flt{padding-top:0}#flt button.on{background:var(--mint);border-color:var(--mint);color:#24403a;font-weight:600}
#flt span{align-self:center;font-size:.78rem;color:var(--mut);flex:0 0 auto}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 6px 18px rgba(164,140,242,.15)}
.han{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
input.s{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;margin-bottom:10px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{background:var(--pri2);color:#3c3450;padding:8px;font-size:.8rem;text-align:left}
td{padding:7px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:nth-child(even) td{background:rgba(164,140,242,.07)}
td.h{font-size:1.45rem;font-weight:600}td.p{color:var(--pri);font-weight:600}
.tag{font-size:.68rem;background:var(--lem);color:#5b4d12;border-radius:8px;padding:2px 6px;white-space:nowrap}
.sp{border:0;background:var(--peach);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1rem;color:#4a3320}
.btn{border:0;background:var(--pri);color:#fff;padding:10px 18px;border-radius:14px;font-size:.95rem;cursor:pointer}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.on{background:var(--mint);color:#24403a}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap;align-items:center}
.fc{perspective:900px;height:250px;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.f .fi{transform:rotateY(180deg)}
.fs{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
.fs.a{background:linear-gradient(135deg,var(--card),var(--lem));border:2px solid var(--lem)}
.fs.b{background:linear-gradient(135deg,var(--sky),var(--pink));color:#2d3550;transform:rotateY(180deg)}
.big{font-size:3.4rem;font-weight:700;line-height:1.2}
.stat{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mut);margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{padding:12px 8px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem;cursor:pointer;min-height:54px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.stage{position:relative;height:150px;border-radius:22px;overflow:hidden;background:linear-gradient(var(--sky),var(--mint));margin-bottom:12px}
.stage.hit{animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gr{position:absolute;bottom:0;left:0;right:0;height:32px;background:var(--peach)}
.hud{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;color:#2d3550;z-index:2}
.sun{position:absolute;top:34px;right:24px;font-size:30px;opacity:.8}
.pl{position:absolute;left:12%;bottom:28px;font-size:44px;transition:bottom .35s ease-out;line-height:1}.pl.jump{bottom:92px}
.ob{position:absolute;left:100%;bottom:28px;font-size:38px;line-height:1}
.zone{min-height:62px;border:2px dashed var(--pri);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tk{padding:8px 13px;border-radius:12px;background:var(--mint);border:0;color:#24403a;font-size:1.35rem;cursor:pointer}
.zone .tk{background:var(--pink);color:#4a2a3a}
.msg{text-align:center;min-height:24px;font-weight:600;margin-top:8px}
.ref{background:var(--peach);color:#4a3320;border-radius:14px;padding:10px;margin-top:8px;font-weight:500}
.mut{color:var(--mut)}.c{text-align:center}
</style>
</head>

 $('#v').innerHTML=`<input class="s" id="q" placeholder="🔍 Tìm chữ Hán, pinyin hoặc nghĩa..."><div class="stat"><span id="cn"></span></div><div class="card tw"><table><thead><tr><th>Bài</th><th>Chữ Hán</th><th>Phiên âm</th><th>Nghĩa</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
 const draw=f=>{const L=pool().filter(w=>!f||(w.h+w.p+w.v).toLowerCase().includes(f));$('#cn').textContent=L.length+' từ';$('#tb').innerHTML=L.map(w=>`<tr><td><span class="tag">${w.ls.map(l=>LN[l].replace('Bài ','')).join(', ')}</span></td><td class="h han">${w.h}</td><td class="p">${w.p}</td><td>${w.v}</td><td><button class="sp" onclick="say('${w.h}')">🔊</button></td></tr>`).join('')};
 draw('');$('#q').oninput=e=>draw(e.target.value.trim().toLowerCase());
}

let deck=[],ci=0,dk='';
function card(){const key=[...sel].join();if(dk!==key){deck=pool();ci=0;dk=key}
 if(ci>=deck.length)ci=0;const w=deck[ci],h=hs(w);
 $('#v').innerHTML=`<div class="stat"><span>Thẻ ${ci+1}/${deck.length}</span><span>Bấm vào thẻ để lật</span></div>
 <div class="fc" id="fc"><div class="fi"><div class="fs a"><div class="big han">${h[0]}</div>${h[1]?`<div class="han" style="font-size:1.4rem">/ ${h[1]}</div>`:''}</div><div class="fs b"><div style="font-size:1.9rem;font-weight:700">${w.p}</div><div style="font-size:1.3rem;margin-top:8px">${w.v}</div></div></div></div>
 <div class="row"><button class="btn g" id="pv">◀ Trước</button><button class="sp" id="sd" style="width:46px;height:46px">🔊</button><button class="btn g" id="nx">Sau ▶</button></div>
 <div class="row"><button class="btn" id="sh">🔀 Xáo trộn</button><button class="btn g" id="rs">↺ Theo thứ tự</button></div>`;
 $('#fc').onclick=()=>$('#fc').classList.toggle('f');$('#sd').onclick=()=>say(w.h);
 $('#pv').onclick=()=>{ci=(ci-1+deck.length)%deck.length;card()};$('#nx').onclick=()=>{ci=(ci+1)%deck.length;card()};
 $('#sh').onclick=()=>{deck=shuf(deck);ci=0;card()};$('#rs').onclick=()=>{deck=pool();ci=0;card()};
}

/* ===== Engine vượt chướng ngại vật ===== */
function runner(key,mkQ,extra=0,head=''){
 stopFn&&stopFn();
 let score=0,lives=3,best=gb('b'+key),alive=true,res0,raf,q,t0,dur;
 $('#v').innerHTML=`${head}<div class="stage" id="st"><div class="hud"><b id="sc"></b><b id="lv"></b></div><div class="sun">☀️</div><div class="ob" id="ob">🪨</div><div class="pl" id="pl">🐰</div><div class="gr"></div></div><div class="card" id="pn"></div>`;
 const hud=()=>{$('#sc').textContent=`⭐ ${score}  · 🏆 ${best}`;$('#lv').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)};
 const ob=$('#ob'),pl=$('#pl');
 const tick=now=>{if(!alive||res0)return;const p=(now-t0)/dur;if(p>=1){res('⏰ Hết giờ!',false);return}ob.style.left=(100-p*83)+'%';raf=requestAnimationFrame(tick)};
 const res=(msg,ok)=>{if(res0||!alive)return;res0=true;cancelAnimationFrame(raf);
  if(ok){score++;if(score>best){best=score;sb('b'+key,best)}pl.classList.add('jump');ob.style.transition='left .9s linear';ob.style.left='-15%';setTimeout(()=>pl.classList.remove('jump'),500)}
  else{lives--;ob.style.left='17%';pl.textContent='💥';$('#st').classList.add('hit');setTimeout(()=>$('#st').classList.remove('hit'),400)}
  hud();const f=$('#fb');if(f)f.innerHTML=msg;setTimeout(next,ok?1100:2300)};
 const next=()=>{if(!alive)return;if(lives<=0){$('#pn').innerHTML=`<div class="c"><div class="big">🏁</div><h3>Kết thúc! Điểm: ${score}</h3><div class="mut">Kỷ lục: ${best}</div><div class="row"><button class="btn" id="again">Chơi lại</button></div></div>`;$('#again').onclick=()=>runner(key,mkQ,extra,head);return}
  pl.textContent='🐰';ob.style.transition='none';ob.style.left='100%';ob.textContent=pick(['🪨','🌵','🪵','🐢']);res0=false;
  q=mkQ();dur=Math.max(5500,13000-score*300)+extra;t0=performance.now();q.show($('#pn'),res);raf=requestAnimationFrame(tick)};
 stopFn=()=>{alive=false;cancelAnimationFrame(raf)};hud();next();
}

/* Game 3: chọn đáp án */
function mcq(){const P=pool();return()=>{const w=pick(P),ty=pick(['hv','vh','hp']);
 const F={hv:[x=>x.v,'Chữ Hán này nghĩa là gì?'],vh:[x=>x.h,'Chọn chữ Hán đúng'],hp:[x=>x.p,'Chọn phiên âm đúng']}[ty],A=F[0](w);
 let o=[A];for(const x of shuf(P)){const t=F[0](x);if(!o.includes(t))o.push(t);if(o.length>=4)break}o=shuf(o);
 return{show(pn,done){pn.innerHTML=`<div class="c"><div class="mut">${F[1]}</div>${ty==='vh'?`<div style="font-size:1.7rem;font-weight:700;margin:8px 0">${w.v}</div>`:`<div class="big han">${w.h}</div><button class="sp" id="ls">🔊</button>`}</div><div class="opts">${o.map(t=>`<button class="opt ${ty==='vh'?'han':''}" style="${ty==='vh'?'font-size:1.5rem':''}">${t}</button>`).join('')}</div><div class="msg" id="fb"></div>`;
  const l=$('#ls');if(l){l.onclick=()=>say(w.h);say(w.h)}
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.textContent===A;document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===A)x.classList.add('ok')});if(!ok)b.classList.add('no');say(w.h);done(ok?'🎉 Chính xác!':`❌ ${w.h} · ${w.p} · ${w.v}`,ok)})}}}}

/* Game 4: phát âm */
let micMode=(window.SpeechRecognition||window.webkitSpeechRecognition)?'mic':'self';
const norm=s=>s.replace(/[\s.,，。？?！!、]/g,'').replace(/10/g,'十').replace(/\d/g,d=>NU[d]);
function talk(){
 const head=`<div class="row" style="margin:0 0 10px"><button class="btn ${micMode==='mic'?'on':'g'}" id="m1">🎤 Dùng micro</button><button class="btn ${micMode==='self'?'on':'g'}" id="m2">✋ Tự chấm</button></div>`;
 runner('talk',()=>{const w=pick(pool()),tg=hs(w).flatMap(t=>[t.replace(/[()]/g,''),t.replace(/\(.*?\)/g,'')]);
  return{show(pn,done){
   pn.innerHTML=`<div class="c"><div class="mut">Đọc to từ này:</div><div class="big han">${w.h}</div><div style="color:var(--pri);font-weight:700;font-size:1.2rem">${w.p}</div><div>${w.v}</div><div class="row"><button class="sp" id="ls">🔊</button>${micMode==='mic'?'<button class="btn" id="mic">🎤 Bấm rồi đọc</button>':'<button class="btn" id="y">✅ Đọc đúng</button><button class="btn g" id="n">❌ Chưa đúng</button>'}</div><div class="msg" id="fb"></div></div>`;
   $('#ls').onclick=()=>say(w.h);
   if(micMode==='self'){$('#y').onclick=()=>done('🎉 Tốt lắm!',true);$('#n').onclick=()=>done(`❌ Đọc lại: ${w.p}`,false);return}
   $('#mic').onclick=()=>{try{const SR=window.SpeechRecognition||window.webkitSpeechRecognition,r=new SR();r.lang='zh-CN';r.maxAlternatives=5;$('#fb').textContent='🎧 Đang nghe...';
    r.onresult=e=>{const al=[...e.results[0]].map(a=>norm(a.transcript));const ok=al.some(a=>tg.some(t=>t&&a.includes(t)));done(ok?`🎉 Nghe được: ${al[0]}`:`❌ Nghe được: ${al[0]||'(không rõ)'} · Đúng: ${w.h}`,ok)};
    r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){micMode='self';$('#fb').innerHTML='Không dùng được micro. Hãy bấm “✋ Tự chấm”.'}else $('#fb').textContent='Không nghe rõ, bấm đọc lại nhé.'};r.start()}catch(e){micMode='self';$('#fb').textContent='Trình duyệt chưa hỗ trợ micro. Hãy dùng “Tự chấm”.'}}}}},4000,head);
 $('#m1').onclick=()=>{micMode='mic';talk()};$('#m2').onclick=()=>{micMode='self';talk()};
}

/* Game 5: dịch câu */
let trMode='cv',trSc={s:0,n:0},cs=null;
function tr(){
 const P=spool();if(P.length<4){$('#v').innerHTML='<div class="card c">Chưa đủ câu cho các bài đã chọn.</div>';return}
 const s=pick(P),full=s.t.join('')+(s.q?'？':'。');
 const head=`<div class="row" style="margin:0 0 10px"><button class="btn ${trMode==='cv'?'on':'g'}" id="a1">中 → Việt</button><button class="btn ${trMode==='vc'?'on':'g'}" id="a2">Việt → 中</button></div><div class="stat"><span>Dịch câu</span><span>✅ ${trSc.s}/${trSc.n}</span></div>`;
 $('#v').innerHTML=`${head}<div class="card" id="pn"></div>`;
 $('#a1').onclick=()=>{trMode='cv';tr()};$('#a2').onclick=()=>{trMode='vc';tr()};
 const fin=ok=>{trSc.n++;if(ok)trSc.s++};
 if(trMode==='cv'){
  let o=[s.v];for(const x of shuf(P)){if(!o.includes(x.v))o.push(x.v);if(o.length>=4)break}o=shuf(o);
  $('#pn').innerHTML=`<div class="c"><div class="mut">Chọn nghĩa tiếng Việt đúng</div><div class="han" style="font-size:2rem;font-weight:700;margin:8px 0">${s.t.join(' ')}${s.q?' ？':''}</div><button class="sp" id="ls">🔊</button></div><div class="opts" style="grid-template-columns:1fr">${o.map(t=>`<button class="opt">${t}</button>`).join('')}</div><div class="msg" id="fb"></div><div class="row"><button class="btn" id="nx" style="display:none">Câu tiếp ▶</button></div>`;
  $('#ls').onclick=()=>say(full);say(full);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.textContent===s.v;document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===s.v)x.classList.add('ok')});if(!ok)b.classList.add('no');$('#fb').innerHTML=ok?'🎉 Chính xác!':`❌ Đáp án: ${s.v}`;fin(ok);$('#nx').style.display='';$('#nx').onclick=tr})
 }else{
  let toks=shuf(s.t.map((t,i)=>({t,i}))),ans=[];
  $('#pn').innerHTML=`<div class="c"><div class="mut">Dịch sang tiếng Trung (ghép từ)</div><div style="font-size:1.3rem;font-weight:700;margin:8px 0">${s.v}</div></div><div class="zone" id="zn"></div><div class="row" id="pool" style="margin-top:0"></div><div class="msg" id="fb"></div><div class="row"><button class="btn g" id="rs">↺ Làm lại</button><button class="btn g" id="xt">🔀 Xáo từ</button><button class="btn" id="ck">Kiểm tra</button></div><div class="row"><button class="btn g" id="nx">Câu khác ▶</button></div>`;
  let done=false;
  const draw=()=>{$('#zn').innerHTML=ans.map(a=>`<button class="tk han" data-i="${a.i}" data-w="1">${a.t}</button>`).join('');$('#pool').innerHTML=toks.filter(x=>!ans.includes(x)).map(x=>`<button class="tk han" data-i="${x.i}">${x.t}</button>`).join('');
   document.querySelectorAll('.tk').forEach(b=>b.onclick=()=>{const x=toks.find(t=>t.i==b.dataset.i);if(b.dataset.w)ans=ans.filter(a=>a!==x);else{ans.push(x);say(x.t)}draw()})};draw();
  $('#rs').onclick=()=>{ans=[];draw();$('#fb').textContent=''};$('#xt').onclick=()=>{toks=shuf(toks);draw()};$('#nx').onclick=tr;
  $('#ck').onclick=()=>{const ok=ans.length===s.t.length&&ans.every((a,i)=>a.t===s.t[i]);if(!done){done=true;fin(ok)}
   $('#fb').innerHTML=ok?`🎉 Chính xác!<br><span class="han" style="font-size:1.4rem">${full}</span>`:`❌ Chưa đúng<div class="ref">💡 Đáp án tham khảo:<br><span class="han" style="font-size:1.4rem">${s.t.join(' ')}${s.q?' ？':' 。'}</span></div>`;say(full)}
 }
}
flt();go('list');
</script>
</body>
